    * {

    body {

    /* Mobile Bottom Navigation Safe Area */
    .safe-area-inset {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Mobile styles */
    .content-top-offset {
      padding-top: 70px;

      padding-top: 110px;

    @media (max-width: 767px) {
      .top-nav {
        padding-top: env(safe-area-inset-top, 0px);

      .content-top-offset {
        padding-top: calc(env(safe-area-inset-top, 0px) + 70px);
      }

        padding-top: calc(env(safe-area-inset-top, 0px) + 110px);

        padding-top: env(safe-area-inset-top, 0px);

    /* Mobile tab active indicator */
    @media (max-width: 767px) {
      .mobile-tab-active {
        position: relative;
      }
      
      .mobile-tab-active::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 50%;
        transform: translateX(-50%);
        width: 20px;
        height: 3px;
        background: #10b981;
        border-radius: 2px;
      }
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse-glow {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
      }

      50% {
        box-shadow: 0 0 40px rgba(16, 185, 129, 0.5);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .animate-fade-in {
      animation: fadeInUp 0.5s ease-out;
    }

    .animate-float {
      animation: float 3s ease-in-out infinite;
    }

    .animate-pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;

    /* Glass-morphism */
    .glass {
      background: rgba(255, 255, 255, 0.85);

    @media (max-width: 767px) {

        border-radius: 0;
        margin: 0;
        width: 100%;
      }
    }

    .glass-dark {

      backdrop-filter: blur(20px);
    }

    /* Gradients */
    .gradient-primary {

    .gradient-header {
      background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #059669 100%);

    @media (max-width: 767px) {

    .gradient-result {

    /* Category badges */

    }

    .badge-gi {

    }

    .badge-supplement {
      background: linear-gradient(135deg, #ec4899, #db2777);
    }

    .badge-topical {
      background: linear-gradient(135deg, #06b6d4, #0891b2);
    }

    /* Hover effects */
    .hover-lift {
      transition: all 0.3s ease;

    .hover-lift:hover {
      transform: translateY(-2px);

    /* Scrollbar styling */

      border-radius: 10px;
    }

    /* Input focus */
    input:focus,
    select:focus {
      outline: none;
      border-color: #10b981 !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    /* Skeleton loader */
    @keyframes skeleton-shimmer {
      0% {
        background-position: -400px 0;
      }

      100% {
        background-position: 400px 0;
      }
    }

    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 400px 100%;
      animation: skeleton-shimmer 1.5s ease-in-out infinite;
      border-radius: 8px;
    }

    .dark .skeleton {
      background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%);
      background-size: 400px 100%;
    }

    /* Dark mode styles */
    .dark body,
    body.dark {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);

    .dark .text-gray-900,

    .dark .border-emerald-100,

    .dark input::placeholder {

    .dark ::-webkit-scrollbar-track {

    .dark .hover-lift:hover {

    /* PWA Install Banner */

    .species-badge {

    }
    .category-badge {
      font-size: 0.65rem;

      padding: 0.1rem 0.5rem;
      border-radius: 9999px;
      white-space: nowrap;
    }
    .prescription-tab-btn {
      transition: all 0.2s ease;
    }
    .prescription-tab-btn.active {

    .dark .prescription-tab-btn:not(.active):hover {

    .prescription-detail {

    }
    .prescription-detail::-webkit-scrollbar {

    }
    .prescription-detail::-webkit-scrollbar-thumb {

    }
    .dark .prescription-detail::-webkit-scrollbar-thumb {
      background: #475569;
    }
    .editor-section {
      margin-bottom: 1.5rem;
    }
    .editor-section-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: #065f46;
      margin-bottom: 0.75rem;
    }
    .dark .editor-section-title {
      color: #6ee7b7;
    }
    .drug-row {
      background: #f0fdf4;
      border: 1px solid #d1fae5;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .dark .drug-row {
      background: rgba(15, 23, 42, 0.5);
      border-color: rgba(51, 65, 85, 0.5);
    }
    .apply-summary {
      max-width: 800px;
      margin: 0 auto;
    }
    .apply-drug-item {
      border-left: 3px solid #10b981;
      padding-left: 1rem;
      margin-bottom: 1rem;
    }
    .dark .apply-drug-item {

    .empty-state {

    .dark .empty-state {

    /* Print styles */
    @media print {
      body * {
        visibility: hidden;
      }
      .print-area, .print-area * {
        visibility: visible;
      }
      .print-area {
        position: absolute;
        left: 0;
        top: 0;

      .print-area .no-print {

      .print-header {

      .print-header h1 {

        color: #065f46;
      }
      .print-header p {
        font-size: 13px;

      .print-drug {

      }
      .print-drug h3 {

        font-weight: 700;
      }
      .print-drug p {

      .print-footer {

    /* RTL support for Arabic */
    .rtl {
      direction: rtl;
      text-align: right;

    }

    .scroll-tabs {

    .scroll-tabs::-webkit-scrollbar {
      display: none;
    }

        #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #065f46 0%, #044e3a 50%, #022c22 100%);
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      user-select: none;
      -webkit-user-select: none;
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: splashAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .splash-badge {
      position: relative;
      width: 112px;
      height: 112px;
      border-radius: 28px;
      background: #ffffff;
      padding: 10px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.45), 0 0 45px rgba(52, 211, 153, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: splashFloat 2.8s ease-in-out infinite alternate;
    }

    .splash-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .splash-glow {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.35) 0%, rgba(52, 211, 153, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
      animation: splashGlowPulse 2.4s ease-in-out infinite alternate;
    }

    .splash-title-wrap {
      margin-top: 22px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .splash-title-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 2.25rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin: 0;
      line-height: 1.1;
      text-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .splash-pill-sub {
      margin-top: 8px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6ee7b7;
      background: rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 5px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .splash-loader-wrap {
      margin-top: 32px;
      width: 130px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .splash-loader-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      background: linear-gradient(90deg, #10b981, #34d399, #a7f3d0);
      border-radius: 9999px;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.8);
      animation: splashLoaderAnim 1.4s ease-in-out infinite;
    }

    .splash-footer-pill {
      position: absolute;
      bottom: 28px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(167, 243, 208, 0.75);
      letter-spacing: 0.02em;
    }

    @keyframes splashAppear {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes splashFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    @keyframes splashGlowPulse {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.4; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.8; }
    }

    @keyframes splashLoaderAnim {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
  </style>
</head>

    // Scrollable Category Tabs Component with Edge Shades & Navigation Arrows
    const ScrollableCategoryTabs = ({ categories, activeCategory, onSelectCategory, className = "" }) => {
      const scrollRef = useRef(null);
      const [canScrollLeft, setCanScrollLeft] = useState(false);
      const [canScrollRight, setCanScrollRight] = useState(true);

      const checkScroll = () => {
        if (!scrollRef.current) return;
        const { scrollLeft, scrollWidth, clientWidth } = scrollRef.current;
        setCanScrollLeft(scrollLeft > 6);
        setCanScrollRight(scrollLeft + clientWidth < scrollWidth - 6);
      };

      useEffect(() => {
        checkScroll();
        const el = scrollRef.current;
        if (el) {
          el.addEventListener('scroll', checkScroll, { passive: true });
        }
        window.addEventListener('resize', checkScroll);
        const t = setTimeout(checkScroll, 100);
        return () => {
          if (el) el.removeEventListener('scroll', checkScroll);
          window.removeEventListener('resize', checkScroll);
          clearTimeout(t);
        };
      }, [categories]);

      const handleScroll = (direction) => {
        if (!scrollRef.current) return;
        const offset = direction === 'left' ? -220 : 220;
        scrollRef.current.scrollBy({ left: offset, behavior: 'smooth' });
        setTimeout(checkScroll, 350);
      };

      return (
        <div className={`relative group ${className}`}>
          {/* Left Shadow / Shade Fade & Arrow */}
          <div
            className={`absolute left-0 top-0 bottom-0 w-12 sm:w-16 z-10 flex items-center justify-start pl-1 sm:pl-2 bg-gradient-to-r from-white/95 via-white/80 to-transparent dark:from-gray-900/95 dark:via-gray-900/80 pointer-events-none transition-all duration-300 ${
              canScrollLeft ? 'opacity-100 translate-x-0' : 'opacity-0 -translate-x-2'
            }`}
          >
            <button
              type="button"
              onClick={() => handleScroll('left')}
              disabled={!canScrollLeft}
              className="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-white dark:bg-gray-800 text-emerald-700 dark:text-emerald-300 shadow-md border border-emerald-200/90 dark:border-gray-600 hover:bg-emerald-50 dark:hover:bg-gray-700 hover:scale-110 active:scale-95 transition-all pointer-events-auto flex items-center justify-center cursor-pointer"
              aria-label="Scroll categories left"
              title="Scroll left"
            >
              <ChevronLeft />
            </button>
          </div>

          {/* Scrollable Container */}
          <div
            ref={scrollRef}
            className="px-4 md:px-6 py-3.5 overflow-x-auto scroll-tabs flex gap-2"
          >
            <div className="flex gap-2 min-w-max">
              {categories.map(cat => {
                const IconComp = cat.icon;
                return (
                  <button
                    key={cat.id}
                    onClick={() => onSelectCategory(cat.id)}
                    className={`px-4 py-2.5 rounded-xl text-sm font-medium transition-all flex items-center gap-2 whitespace-nowrap ${
                      activeCategory === cat.id
                        ? `${cat.color && cat.color.startsWith('bg-') && cat.id !== 'all' ? cat.color : 'bg-emerald-500'} text-white shadow-lg scale-[1.02]`
                        : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-emerald-50 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700'
                    }`}
                  >
                    {IconComp && (typeof IconComp === 'function' ? <IconComp className="w-4 h-4 shrink-0" /> : <span>{IconComp}</span>)}
                    <span>{cat.name}</span>
                  </button>
                );
              })}
            </div>
          </div>

                          isTop ? 'bg-emerald-50/30 dark:bg-emerald-950/20 border-emerald-300' : 'bg-slate-50 dark:bg-slate-700/50 border-slate-200 dark:border-slate-700'
                        }`}>

                              <span>{rep.avatar || '🩺'}</span>
                              <span className="font-bold text-slate-900 dark:text-slate-100">{rep.author}</span>
                              <span className="text-indigo-600 font-medium">({rep.title})</span>

                            <span className="text-slate-400">{formatTime(rep.timestamp)}</span>

                            <button
                              onClick={() => handleUpvote(rep.id)}

                            >
                              ▲ Upvote ({rep.upvotes || 0})

                  ) : (
                    <div className="p-6 text-center text-slate-400 text-xs">

                {/* Answer Composer */}

                  <label className="block text-xs font-bold text-slate-700 dark:text-slate-300">Share your clinical advice</label>
                  <textarea
                    rows="2"

                  />
                  <div className="flex items-center justify-end gap-2">

                      {newMessage.length}/{MAX_POST_LENGTH}

                      Post Answer

                  </div>

          )}

          {/* Profile Edit Modal */}
          {showProfileModal && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-md w-full border border-slate-200 dark:border-slate-700 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                  <h3 className="font-extrabold text-base text-slate-900 dark:text-slate-100">👤 Set Your Practitioner Profile</h3>
                  <button onClick={() => setShowProfileModal(false)} className="text-slate-400 hover:text-slate-600"><X /></button>
                </div>
                <form onSubmit={handleSaveProfile} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Your Name & Title <span className="text-red-500">*</span></label>
                    <input
                      type="text"
                      required
                      placeholder="e.g., Dr. Ahmed Mahmoud"
                      value={inputName}
                      onChange={(e) => setInputName(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-sm font-medium text-slate-900 dark:text-slate-100 focus:border-indigo-500"
                    />

                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Specialty / Role</label>
                    <input
                      type="text"

                      onChange={(e) => setInputTitle(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-sm font-medium text-slate-900 dark:text-slate-100 focus:border-indigo-500"
                    />

                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Avatar Icon</label>
                    <div className="flex gap-2">
                      {['🩺', '💊', '📋', '💉', '🔬', '🏥'].map(a => (
                        <button
                          type="button"
                          key={a}
                          onClick={() => setInputAvatar(a)}
                          className={`p-2 rounded-xl text-xl transition-all ${inputAvatar === a ? 'bg-indigo-100 border-2 border-indigo-500 scale-105 shadow-xs' : 'bg-slate-100 hover:bg-slate-200'}`}

                    <button
                      type="button"

                    >
                      Cancel
                    </button>
                    <button
                      type="submit"

          )}

          {/* User Profile View Card Modal */}
          {selectedUserProfile && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fade-in" onClick={() => setSelectedUserProfile(null)}>
              <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full border border-slate-200 dark:border-slate-700 shadow-2xl space-y-4" onClick={(e) => e.stopPropagation()}>
                <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                  <h3 className="font-extrabold text-base text-slate-900 dark:text-slate-100">👤 User Profile</h3>
                  <button onClick={() => setSelectedUserProfile(null)} className="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
                </div>
                <div className="text-center space-y-3">
                  <div className="w-16 h-16 mx-auto bg-slate-100 dark:bg-slate-700 rounded-2xl flex items-center justify-center text-3xl">
                    {selectedUserProfile.avatar || '🩺'}
                  </div>
                  <div>
                    <div className="font-extrabold text-lg text-slate-900 dark:text-slate-100">{selectedUserProfile.displayName || 'Anonymous Vet'}</div>
                    <div className="text-sm text-slate-500 dark:text-slate-400">{selectedUserProfile.title || 'Veterinarian'}</div>
                  </div>
                  <div className="flex justify-center gap-6 text-sm">
                    <div className="text-center">
                      <div className="font-bold text-indigo-600">{selectedUserProfile.postCount || 0}</div>
                      <div className="text-xs text-slate-500">Posts</div>
                    </div>
                    <div className="text-center">
                      <div className="font-bold text-emerald-600">{selectedUserProfile.messageCount || 0}</div>
                      <div className="text-xs text-slate-500">Messages</div>
                    </div>
                  </div>
                  <div className="text-xs text-slate-400">
                    Joined: {selectedUserProfile.joinDate ? new Date(selectedUserProfile.joinDate).toLocaleDateString() : 'Unknown'}
                  </div>
                </div>
                <button
                  onClick={() => setSelectedUserProfile(null)}
                  className="w-full py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-xl font-bold text-xs text-slate-700 dark:text-slate-300 transition-all"
                >
                  Close
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const VetDosageCalculator = () => {
      const [medications, setMedications] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedMed, setSelectedMed] = useState(null);
      const infoRef = useRef(null);
      const [species, setSpecies] = useState('');
      const [weight, setWeight] = useState('');
      const [result, setResult] = useState(null);
      const [concentrationMg, setConcentrationMg] = useState('');
      const [concentrationMl, setConcentrationMl] = useState('');
      const [showConcentrationInput, setShowConcentrationInput] = useState(false);
      const [showAddModal, setShowAddModal] = useState(false);
      const [editingMed, setEditingMed] = useState(null);
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(null);
      const [activeCategory, setActiveCategory] = useState('all');
      const [animalTypeFilter, setAnimalTypeFilter] = useState('all');
      const [favorites, setFavorites] = useState([]);
      const [showFavoritesOnly, setShowFavoritesOnly] = useState(false);
      const [darkMode, setDarkMode] = useState(false);
      const [isLoading, setIsLoading] = useState(true);
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [showInstallBanner, setShowInstallBanner] = useState(false);
      const [showScrollTop, setShowScrollTop] = useState(false);

      // Scroll listener for Floating Scroll-to-Top Arrow
      useEffect(() => {
        const handleScroll = () => {
          if (window.scrollY > 250) {
            setShowScrollTop(true);
          } else {
            setShowScrollTop(false);
          }
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollToTop = () => {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      };

      // Prescription Templates state
      const [activeTab, setActiveTab] = useState('calculator');
      const [prescriptions, setPrescriptions] = useState([]);
      const [showPrescriptionModal, setShowPrescriptionModal] = useState(false);
      const [editingPrescription, setEditingPrescription] = useState(null);
      const [viewingPrescription, setViewingPrescription] = useState(null);
      const [prescriptionSearch, setPrescriptionSearch] = useState('');
      const [prescriptionCategory, setPrescriptionCategory] = useState('all');
      const [prescriptionSpecies, setPrescriptionSpecies] = useState('all');
      const [showApplyDialog, setShowApplyDialog] = useState(false);
      const [appliedWeight, setAppliedWeight] = useState('');
      const [appliedSpecies, setAppliedSpecies] = useState('');
      const [showPrescriptionDelete, setShowPrescriptionDelete] = useState(null);

      // Load medications, favorites, and dark mode from localStorage on mount
      useEffect(() => {
        // Simulate loading delay for skeleton effect
        const loadData = async () => {
          setIsLoading(true);
          await new Promise(resolve => setTimeout(resolve, 500));

          const saved = localStorage.getItem('vetiDrugMedications');
          const savedFavorites = localStorage.getItem('vetiDrugFavorites');
          const savedDarkMode = localStorage.getItem('vetiDrugDarkMode');

          if (saved) {
            const parsed = JSON.parse(saved);
            const validSaved = parsed.filter(m => ['dog', 'cat', 'both'].includes(m.species) && (DEFAULT_MEDICATIONS.some(d => d.id === m.id) || !/^\d+b?$/.test(m.id)));
            const existingIds = new Set(validSaved.map(m => m.id));
            const missingDefaults = DEFAULT_MEDICATIONS.filter(d => !existingIds.has(d.id));
            const updated = [...validSaved, ...missingDefaults].map(savedMed => {
              const defaultMed = DEFAULT_MEDICATIONS.find(d => d.id === savedMed.id);
              if (defaultMed) {
                return {
                  ...savedMed,
                  species: defaultMed.species,
                  route: defaultMed.route,
                  dosage_form: defaultMed.dosage_form,
                  frequency: defaultMed.frequency,
                  unit_description: defaultMed.unit_description,
                  notes: defaultMed.notes,
                  dose_mg_per_kg_min: defaultMed.dose_mg_per_kg_min,
                  dose_mg_per_kg_max: defaultMed.dose_mg_per_kg_max,
                  species_doses: defaultMed.species_doses,
                  concentration_value: defaultMed.concentration_value,
                  concentration_unit: defaultMed.concentration_unit,
                  concentration_ml: defaultMed.concentration_ml || 1,
                  food_restriction: defaultMed.food_restriction || 'none',
                  meat_withdrawal_days: defaultMed.meat_withdrawal_days,
                  milk_withdrawal_hours: defaultMed.milk_withdrawal_hours,
                  food_restriction_note: defaultMed.food_restriction_note
                };
              }
              return savedMed;
            });
            setMedications(updated);
            localStorage.setItem('vetiDrugMedications', JSON.stringify(updated));
          } else {
            setMedications(DEFAULT_MEDICATIONS);
            localStorage.setItem('vetiDrugMedications', JSON.stringify(DEFAULT_MEDICATIONS));
          }
          if (savedFavorites) {
            setFavorites(JSON.parse(savedFavorites));
          }
          if (savedDarkMode === 'true') {
            setDarkMode(true);
            document.documentElement.classList.add('dark');
          }

          // Load prescription templates from localStorage and merge with built-ins
          try {
            const savedPrescriptions = localStorage.getItem('vet_prescriptions_v1');
            const userTemplates = savedPrescriptions ? JSON.parse(savedPrescriptions) : [];
            if (!Array.isArray(userTemplates)) throw new Error('Invalid prescriptions data');
            const merged = [...BUILTIN_TEMPLATES, ...userTemplates.filter(t => !t.is_builtin)];
            setPrescriptions(merged);
          } catch (e) {
            console.warn('Failed to load prescriptions:', e);
            setPrescriptions([...BUILTIN_TEMPLATES]);
          }

          setIsLoading(false);
        };
        loadData();
      }, []);

      // PWA Install Prompt
      useEffect(() => {
        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
          // Check if user hasn't dismissed the banner recently
          const dismissed = localStorage.getItem('vetiDrugInstallDismissed');
          const dismissedTime = dismissed ? parseInt(dismissed) : 0;
          const daysSinceDismissed = (Date.now() - dismissedTime) / (1000 * 60 * 60 * 24);
          if (daysSinceDismissed > 7) {
            setShowInstallBanner(true);
          }
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, []);

      // Toggle dark mode
      const toggleDarkMode = () => {
        const newMode = !darkMode;
        setDarkMode(newMode);
        localStorage.setItem('vetiDrugDarkMode', newMode.toString());
        if (newMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      };

      // Handle PWA install
      const handleInstallClick = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            setShowInstallBanner(false);
          }
          setDeferredPrompt(null);
        }
      };

      // Dismiss install banner
      const dismissInstallBanner = () => {
        setShowInstallBanner(false);
        localStorage.setItem('vetiDrugInstallDismissed', Date.now().toString());
      };

      // Round to practical clinical values (nearest 0.1)
      const roundToClinical = (value) => {
        if (!value) return null;
        const num = parseFloat(value);
        if (isNaN(num)) return value;
        return (Math.round(num * 10) / 10).toFixed(1);
      };

      // Save medications to localStorage whenever they change
      const saveMedications = (meds) => {
        setMedications(meds);
        localStorage.setItem('vetiDrugMedications', JSON.stringify(meds));
      };

      // Save prescription templates to localStorage
      const saveTemplates = (templates) => {
        setPrescriptions(templates);
        try {
          const userOnly = templates.filter(t => !t.is_builtin);
          localStorage.setItem('vet_prescriptions_v1', JSON.stringify(userOnly));
        } catch (e) {
          alert('Unable to save. Storage is full. Please remove some templates.');
        }
      };

      // Toggle favorite
      const toggleFavorite = (medId) => {
        const newFavorites = favorites.includes(medId)
          ? favorites.filter(id => id !== medId)
          : [...favorites, medId];
        setFavorites(newFavorites);
        localStorage.setItem('vetiDrugFavorites', JSON.stringify(newFavorites));
      };

      const filteredMeds = useMemo(() => {
        let filtered = medications;

        // Filter by Species (All Small Animals vs Dogs vs Cats)
        if (animalTypeFilter === 'dog') {
          filtered = filtered.filter(med =>
            ['dog', 'both'].includes(med.species)
          );
        } else if (animalTypeFilter === 'cat') {
          filtered = filtered.filter(med =>
            ['cat', 'both'].includes(med.species)
          );
        }

        // Filter by search term
        if (searchTerm) {
          const term = searchTerm.toLowerCase();
          filtered = filtered.filter(med =>
            med.brand_name.toLowerCase().includes(term) ||
            med.generic_name.toLowerCase().includes(term)
          );
        }

        // Filter by category
        if (activeCategory !== 'all') {
          filtered = filtered.filter(med => getCategory(med) === activeCategory);
        }

        // Filter by favorites
        if (showFavoritesOnly) {
          filtered = filtered.filter(med => favorites.includes(med.id));
        }

        return filtered;
      }, [searchTerm, medications, activeCategory, showFavoritesOnly, favorites, animalTypeFilter]);

      const calculateDosage = () => {
        if (!selectedMed || !species || !weight) return;
        const w = parseFloat(weight);
        if (isNaN(w) || w <= 0) return;

        let minDoseMgKg = selectedMed.dose_mg_per_kg_min;
        let maxDoseMgKg = selectedMed.dose_mg_per_kg_max;
        let currentFreq = selectedMed.frequency;
        let currentRoute = selectedMed.route;
        let contraindicationWarning = null;

        // Check if species-specific dosing rules exist
        if (selectedMed.species_doses && selectedMed.species_doses[species]) {
          const spInfo = selectedMed.species_doses[species];
          if (spInfo.contraindicated) {
            contraindicationWarning = spInfo.warning || `⚠️ This medication is strictly contraindicated in ${getSpeciesLabel(species)}!`;
          } else {
            if (spInfo.min !== undefined) minDoseMgKg = spInfo.min;
            if (spInfo.max !== undefined) maxDoseMgKg = spInfo.max;
            if (spInfo.freq) currentFreq = spInfo.freq;
            if (spInfo.route) currentRoute = spInfo.route;
          }
        }

        if (contraindicationWarning) {
          setResult({
            contraindicated: true,
            warning: contraindicationWarning,
            species: species
          });
          return;
        }

        const minDose = minDoseMgKg * w;
        const maxDose = maxDoseMgKg * w;
        const avgDose = (minDose + maxDose) / 2;
        let volumeData = null;
        if (concentrationMg && concentrationMl) {
          const concMg = parseFloat(concentrationMg);
          const concMl = parseFloat(concentrationMl);
          if (!isNaN(concMg) && !isNaN(concMl) && concMg > 0 && concMl > 0) {
            const mgPerMl = concMg / concMl;
            volumeData = {
              minVolume: (minDose / mgPerMl).toFixed(2),
              maxVolume: (maxDose / mgPerMl).toFixed(2),
              avgVolume: (avgDose / mgPerMl).toFixed(2),
              concentration: `${concMg}mg/${concMl}ml`
            };
          }
        }
        setResult({
          minDose: minDose.toFixed(2),
          maxDose: maxDose.toFixed(2),
          avgDose: avgDose.toFixed(2),
          minDoseMgKg: minDoseMgKg,
          maxDoseMgKg: maxDoseMgKg,
          frequency: currentFreq,
          route: currentRoute,
          volume: volumeData
        });
      };

      const renderClinicalNotes = (notesStr, genericName) => {
        if (!notesStr) return null;

        const headerPatterns = [
          { key: 'category', label: 'Category', regex: /(?:^|\b)(?:Category|Class)\s*:\s*([^]+?)(?=(?:\b(?:Active Ingredient|Indications?|Contraindications?|Warnings?|Warning|Precautions?|Dosage|Dosing|Withdrawal|Ref|Reference)\s*:|$))/i },
          { key: 'indications', label: 'Indications', regex: /(?:^|\b)(?:Indications?|Uses?)\s*:\s*([^]+?)(?=(?:\b(?:Category|Active Ingredient|Contraindications?|Warnings?|Warning|Precautions?|Dosage|Dosing|Withdrawal|Ref|Reference)\s*:|$))/i },
          { key: 'contraindications', label: 'Contraindications', regex: /(?:^|\b)(?:Contraindications?)\s*:\s*([^]+?)(?=(?:\b(?:Category|Active Ingredient|Indications?|Warnings?|Warning|Precautions?|Dosage|Dosing|Withdrawal|Ref|Reference)\s*:|$))/i },
          { key: 'warnings', label: 'Warnings & Precautions', regex: /(?:^|\b)(?:⚠️\s*)?(?:Warnings?|Warning|Precautions?)\s*:\s*([^]+?)(?=(?:\b(?:Category|Active Ingredient|Indications?|Contraindications?|Dosage|Dosing|Withdrawal|Ref|Reference)\s*:|$))/i },
          { key: 'dosage_guide', label: 'Dosing Guide', regex: /(?:^|\b)(?:Dosage|Dosing)\s*:\s*([^]+?)(?=(?:\b(?:Category|Active Ingredient|Indications?|Contraindications?|Warnings?|Warning|Precautions?|Withdrawal|Ref|Reference)\s*:|$))/i },
          { key: 'withdrawal', label: 'Withdrawal Info', regex: /(?:^|\b)(?:Withdrawal)\s*:\s*([^]+?)(?=(?:\b(?:Category|Active Ingredient|Indications?|Contraindications?|Warnings?|Warning|Precautions?|Dosage|Dosing|Ref|Reference)\s*:|$))/i },
          { key: 'ref', label: 'Reference', regex: /(?:^|\b)(?:Ref|Reference)\s*:\s*([^]+?)$/i }
        ];

        const parsedSections = [];

        if (genericName) {
          parsedSections.push({
            key: 'active_ingredient',
            label: 'Active Ingredient',
            content: genericName
          });
        }

        let matchedAny = false;
        headerPatterns.forEach(p => {
          const match = notesStr.match(p.regex);
          if (match && match[1] && match[1].trim()) {
            matchedAny = true;
            parsedSections.push({
              key: p.key,
              label: p.label,
              content: match[1].trim()
            });
          }
        });

        if (!matchedAny) {
          parsedSections.push({
            key: 'guidance',
            label: 'Clinical Guidance',
            content: notesStr
          });
        }

        const getSectionIcon = (key) => {
          switch (key) {
            case 'active_ingredient': return <Flask className="w-3.5 h-3.5 text-emerald-600 dark:text-emerald-400" />;
            case 'category': return <TagIcon className="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400" />;
            case 'indications': return <TargetIcon className="w-3.5 h-3.5 text-teal-600 dark:text-teal-400" />;
            case 'contraindications': return <ShieldAlertIcon className="w-3.5 h-3.5 text-rose-600 dark:text-rose-400" />;
            case 'warnings': return <AlertTriangleIcon className="w-3.5 h-3.5 text-amber-600 dark:text-amber-400" />;
            case 'dosage_guide': return <Clipboard className="w-3.5 h-3.5 text-blue-600 dark:text-blue-400" />;
            case 'withdrawal': return <HourglassIcon className="w-3.5 h-3.5 text-orange-600 dark:text-orange-400" />;
            case 'ref': return <BookOpenIcon className="w-3.5 h-3.5 text-slate-500 dark:text-slate-400" />;
            default: return <InfoIcon className="w-3.5 h-3.5 text-amber-600 dark:text-amber-400" />;
          }
        };

        return (
          <div className="mt-4 rounded-2xl bg-amber-50/90 dark:bg-slate-900 border-2 border-amber-300/80 dark:border-amber-500/40 p-4 md:p-5 shadow-sm animate-fade-in">
            {/* Centered Top Header */}
            <div className="flex items-center justify-center gap-2 pb-3 mb-3.5 border-b border-amber-200/80 dark:border-slate-800 text-center">
              <AlertTriangleIcon className="w-4 h-4 text-amber-600 dark:text-amber-400" />
              <h4 className="font-extrabold text-xs sm:text-sm uppercase tracking-wider text-amber-900 dark:text-amber-300">
                Clinical Notes & Pharmacology
              </h4>
            </div>

            {/* Subsections Grid */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
              {parsedSections.map((sec, idx) => {
                const isWarning = sec.key === 'warnings' || sec.key === 'contraindications';
                const isFullWidth = sec.key === 'category' || sec.key === 'indications' || sec.key === 'warnings' || sec.key === 'contraindications' || sec.key === 'guidance';

                return (
                  <div
                    key={idx}
                    className={`${isFullWidth ? 'md:col-span-2' : ''} p-3 rounded-xl transition-all ${
                      isWarning
                        ? 'bg-rose-50/90 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/60'
                        : 'bg-white/95 dark:bg-slate-800/90 border border-amber-200/80 dark:border-slate-700/80 shadow-2xs'
                    }`}
                  >
                    <div className="flex items-center gap-1.5 mb-1">
                      <span className="shrink-0">{getSectionIcon(sec.key)}</span>
                      <span className={`text-[11px] font-extrabold uppercase tracking-wider ${
                        isWarning ? 'text-rose-700 dark:text-rose-300' : 'text-amber-800 dark:text-amber-300'
                      }`}>
                        {sec.label}
                      </span>
                    </div>
                    <div className={`text-xs sm:text-sm leading-relaxed font-medium ${
                      isWarning
                        ? 'text-rose-950 dark:text-rose-100'
                        : sec.key === 'ref'
                        ? 'text-slate-600 dark:text-slate-400 italic'
                        : 'text-slate-800 dark:text-slate-200'
                    }`}>
                      {sec.content}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      const handleMedSelect = (med) => {
        setSelectedMed(med);
        setResult(null);
        setConcentrationMg('');
        setConcentrationMl('');
        setShowConcentrationInput(false);
        if (med.species === 'cat') {
          setSpecies('cat');
        } else {
          setSpecies('dog');
        }
        if (med.concentration_value && med.concentration_value > 0) {
          setConcentrationMg(med.concentration_value.toString());
          setConcentrationMl(med.concentration_ml ? med.concentration_ml.toString() : '1');
          setShowConcentrationInput(true);
        }
        window.scrollTo({ top: 0, behavior: 'instant' });
      };

      const resetForm = () => {
        setSelectedMed(null);
        setSpecies('');
        setWeight('');
        setResult(null);
        setConcentrationMg('');
        setConcentrationMl('');
        setShowConcentrationInput(false);
        window.scrollTo({ top: 0, behavior: 'instant' });
      };

      const handleAddMedication = (newMed) => {
        const medWithId = { ...newMed, id: Date.now().toString() };
        saveMedications([...medications, medWithId]);
        setShowAddModal(false);
      };

      const handleEditMedication = (updatedMed) => {
        saveMedications(medications.map(m => m.id === updatedMed.id ? updatedMed : m));
        setEditingMed(null);
        if (selectedMed && selectedMed.id === updatedMed.id) {
          setSelectedMed(updatedMed);
        }
      };

      const handleDeleteMedication = (id) => {
        saveMedications(medications.filter(m => m.id !== id));
        setShowDeleteConfirm(null);
        if (selectedMed && selectedMed.id === id) {
          resetForm();
        }
      };

      return (
        <div className={`min-h-screen p-4 pb-2 md:p-6 flex flex-col transition-colors duration-300 ${darkMode ? 'dark' : ''}`}>
          {/* PWA Install Banner */}
          {showInstallBanner && (
            <div className="pwa-banner fixed top-0 left-0 right-0 z-[60] px-3 py-2 sm:px-4 sm:py-2.5 text-white shadow-md">
              <div className="max-w-4xl mx-auto flex items-center justify-between gap-2">
                <div className="flex items-center gap-2.5 min-w-0 flex-1">
                  <div className="p-1.5 sm:p-2 bg-white/20 rounded-xl shrink-0">
                    <Download />
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="font-bold text-xs sm:text-sm truncate">Install InVet Calc</div>
                    <div className="text-[10px] sm:text-xs text-emerald-100 truncate">Add to home screen for quick access</div>
                  </div>
                </div>
                <div className="flex items-center gap-1.5 shrink-0">
                  <button
                    onClick={handleInstallClick}
                    className="px-3 py-1.5 sm:px-4 sm:py-2 bg-white text-emerald-700 rounded-lg text-xs sm:text-sm font-bold hover:bg-emerald-50 transition-all active:scale-95 shadow-sm"
                  >
                    Install
                  </button>
                  <button
                    onClick={dismissInstallBanner}
                    className="p-1.5 text-white/80 hover:text-white transition-all rounded-lg hover:bg-white/10"
                    title="Dismiss"
                  >
                    <X />
                  </button>
                </div>
              </div>
            </div>
          )}

          <div className={`px-0 sm:px-6 lg:px-8 mobile-bottom-padding content-top-offset flex-1 flex flex-col ${showInstallBanner ? 'banner-top-offset' : ''}`}>
            {/* Main Navigation: Fixed Top Facebook-style Bar */}
            <div className={`top-nav fixed left-0 right-0 z-50 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 shadow-sm ${showInstallBanner ? 'top-[50px] sm:top-[54px]' : 'top-0'}`}>
              <div className="flex justify-around items-center max-w-lg mx-auto">
                <button
                  onClick={() => {
                    setActiveTab('calculator');
                    if (selectedMed) resetForm();
                  }}
                  className={`flex-1 flex flex-col items-center py-3 px-2 transition-all border-b-2 ${
                    activeTab === 'calculator'
                      ? 'border-emerald-600 text-emerald-600 dark:text-emerald-400 dark:border-emerald-400'
                      : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-emerald-600 dark:hover:text-emerald-400'
                  }`}
                >
                  <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" strokeWidth={activeTab === 'calculator' ? 2.5 : 2} viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                  </svg>
                  <span className="text-[10px] font-semibold">Medications</span>
                </button>
                <button
                  onClick={() => setActiveTab('prescriptions')}
                  className={`flex-1 flex flex-col items-center py-3 px-2 transition-all border-b-2 ${
                    activeTab === 'prescriptions'
                      ? 'border-emerald-600 text-emerald-600 dark:text-emerald-400 dark:border-emerald-400'
                      : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-emerald-600 dark:hover:text-emerald-400'
                  }`}
                >
                  <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" strokeWidth={activeTab === 'prescriptions' ? 2.5 : 2} viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                  </svg>
                  <span className="text-[10px] font-semibold">Prescriptions</span>
                </button>
                <button
                  onClick={() => setActiveTab('community')}
                  className={`flex-1 flex flex-col items-center py-3 px-2 transition-all border-b-2 ${
                    activeTab === 'community'
                      ? 'border-emerald-600 text-emerald-600 dark:text-emerald-400 dark:border-emerald-400'
                      : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-emerald-600 dark:hover:text-emerald-400'
                  }`}
                >
                  <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" strokeWidth={activeTab === 'community' ? 2.5 : 2} viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z" />
                  </svg>
                  <span className="text-[10px] font-semibold">Community</span>
                </button>
              </div>
            </div>

            {/* Premium Header */}
            <div className="glass min-h-[calc(100vh-85px)] md:min-h-0 flex-1 flex flex-col justify-between rounded-3xl shadow-2xl overflow-hidden animate-fade-in">
              {activeTab === 'calculator' && (
                !selectedMed ? (
                  /* BROWSE & SEARCH DRUG LIST VIEW */
                  <div className="flex-1 flex flex-col justify-between animate-fade-in">
                    <div className="gradient-header p-3 md:p-8 text-white relative overflow-hidden">

                      <div className="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full -translate-y-32 translate-x-32"></div>
                      <div className="absolute bottom-0 left-0 w-48 h-48 bg-white/5 rounded-full translate-y-24 -translate-x-24"></div>

                        const matched = medications.find(m =>
                          m.id === drug.drug_id ||
                          m.brand_name.toLowerCase().includes(drug.drug_name.toLowerCase()) ||
                          m.generic_name.toLowerCase().includes(drug.drug_name.toLowerCase())
                        );
                        const w = parseFloat(appliedWeight);
                        const canCalc = matched && matched.dose_mg_per_kg_min > 0 && matched.dose_mg_per_kg_max > 0 && !isNaN(w) && w > 0;
                        const minMg = canCalc ? (matched.dose_mg_per_kg_min * w).toFixed(1) : null;
                        const maxMg = canCalc ? (matched.dose_mg_per_kg_max * w).toFixed(1) : null;
                        const avgMg = canCalc ? (((matched.dose_mg_per_kg_min + matched.dose_mg_per_kg_max) / 2) * w).toFixed(1) : null;

                        return (
                          <div key={idx} className="apply-drug-item pb-3">
                            <div className="flex items-start justify-between">
                              <h3 className="font-bold text-gray-800 dark:text-white">{drug.drug_name}</h3>
                              {drug.duration && (
                                <span className="text-xs bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300 px-2 py-0.5 rounded-full font-medium">{drug.duration}</span>
                              )}
                            </div>
                            <p className="text-sm font-medium text-emerald-600 dark:text-emerald-400 mt-1">{drug.dose_note}</p>
                            {canCalc ? (
                              <div className="flex gap-4 mt-1.5 text-sm">
                                <span className="text-gray-600 dark:text-gray-400">Dose: <strong>{minMg} – {maxMg} mg</strong></span>
                                <span className="text-violet-600 dark:text-violet-400">Average: <strong>{avgMg} mg</strong></span>
                              </div>
                            ) : (
                              <p className="text-xs text-amber-600 dark:text-amber-400 mt-1">
                                ⚠️ Drug not found in database — dose note shown above
                              </p>
                            )}
                            {drug.purpose && <p className="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Purpose: {drug.purpose}</p>}
                          </div>
                        );
                      })}
                    </div>

                    {/* Supportive Care */}
                    {viewingPrescription.supportive_care && viewingPrescription.supportive_care.length > 0 && (
                      <div className="mt-4 pt-3 border-t border-gray-200 dark:border-gray-700">
                        <h4 className="font-semibold text-gray-700 dark:text-gray-300 text-sm mb-2">Supportive Care:</h4>
                        <ul className="space-y-1">
                          {viewingPrescription.supportive_care.map((item, idx) => (
                            <li key={idx} className="text-xs text-gray-600 dark:text-gray-400 flex items-start gap-1.5">
                              <span>•</span>
                              <span>{item}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}

                    {/* Notes */}
                    {viewingPrescription.notes && (
                      <div className="mt-4 pt-3 border-t border-gray-200 dark:border-gray-700 text-xs text-amber-700 dark:text-amber-400">
                        ⚠️ {viewingPrescription.notes}
                      </div>
                    )}

                    <div className="print-footer">
                      Generated by InVet-Dosage Calculator — Always verify dosages before prescribing
                    </div>

                    <div className="no-print flex gap-3 mt-6">
                      <button
                        onClick={() => window.print()}
                        className="flex-1 px-4 py-3 bg-emerald-500 text-white rounded-xl font-semibold hover:bg-emerald-600 transition-all active:scale-95 shadow-lg"
                      >
                        🖨️ Print Prescription
                      </button>
                      <button
                        onClick={() => { setShowApplyDialog(false); setAppliedWeight(''); setAppliedSpecies(''); }}
                        className="px-4 py-3 border-2 border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-400 rounded-xl font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition-all"
                      >
                        Close
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Prescription Delete Confirmation */}
          {showPrescriptionDelete && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
              <div className="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-md w-full shadow-2xl">
                <h3 className="text-xl font-bold text-gray-900 dark:text-white mb-2">Delete Prescription Template?</h3>
                <p className="text-gray-600 dark:text-gray-400 mb-4">
                  Are you sure you want to delete <span className="font-semibold">{showPrescriptionDelete.name}</span>? This action cannot be undone.
                </p>
                <div className="flex gap-3">
                  <button
                    onClick={() => setShowPrescriptionDelete(null)}
                    className="flex-1 px-4 py-3 border-2 border-gray-300 dark:border-gray-600 rounded-xl font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-95 transition-all"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      saveTemplates(prescriptions.filter(t => t.id !== showPrescriptionDelete.id));
                      setShowPrescriptionDelete(null);
                    }}
                    className="flex-1 px-4 py-3 bg-red-500 text-white rounded-xl font-semibold hover:bg-red-600 active:scale-95 transition-all"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Prescription Editor Modal */}
          {showPrescriptionModal && (
            <PrescriptionEditor
              template={editingPrescription}
              medications={medications}
              onSave={(saved) => {
                const savedWithId = {
                  ...saved,
                  id: saved.is_builtin ? Date.now().toString() : saved.id,
                  is_builtin: false
                };
                const exists = prescriptions.find(t => t.id === savedWithId.id);
                if (exists) {
                  saveTemplates(prescriptions.map(t => t.id === savedWithId.id ? savedWithId : t));
                } else {
                  saveTemplates([...prescriptions, savedWithId]);
                }
                setShowPrescriptionModal(false);
                setEditingPrescription(null);
              }}
              onCancel={() => {
                setShowPrescriptionModal(false);
                setEditingPrescription(null);
              }}
            />
          )}
        </div>
      </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<VetDosageCalculator />);

    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 600);
      }
    }, 2400);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ Service Worker registered - Full offline support active!'))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</body>

</html>
